                <img src="/image/DhNnCGX7Ynf071kbjTKv0xJm_VoQuR5PmdaZ2Gh-rLTlh2QZi2mpRm7Tul9AhS4s7iLRrz8jbvdSvh84LKTNkNcgGu8xCSnvaTtLIY3ZH4XyJaOl--pIhzpdpHdAjdlJj_VgK8FVXwQq0crwaqJ9sQ.webp" alt="Seneca" class="w-full h-full object-cover filter grayscale contrast-125">

            <div class="w-72 h-[480px] rounded-3xl overflow-hidden border border-zinc-800 bg-[#141417] shadow-2xl relative">

            </div>
            <div class="w-72 h-[480px] rounded-3xl overflow-hidden border border-zinc-800 bg-[#141417] shadow-2xl relative">
                <img src="/image/DeOTfhDPsXuw8s_O-Ai4-3VXJ8Bzqyj0EkhHtZi5PV6DSKJgga5h0Hbg6GOdFhjN_MEpPKGRuQkv19AQhtZ0TGogqukXDyUvUbuPz71JJizNCq-NqYygV3AkzIjJcSjgiyq4_A5xo5FTOzbD3qD3Uw.webp" alt="Socrates" class="w-full h-full object-cover filter grayscale contrast-125">
            </div>
            <div class="w-72 h-[480px] rounded-3xl overflow-hidden border border-zinc-800 bg-[#141417] shadow-2xl relative">
                <img src="/image/DhNnCGX7Ynf071kbjTKv0xJm_VoQuR5PmdaZ2Gh-rLTlh2QZi2mpRm7Tul9AhS4s7iLRrz8jbvdSvh84LKTNkNcgGu8xCSnvaTtLIY3ZH4XyJaOl--pIhzpdpHdAjdlJj_VgK8FVXwQq0crwaqJ9sQ.webp" alt="Seneca" class="w-full h-full object-cover filter grayscale contrast-125">
            </div>
        </div>
    </div>

    <!-- 우측 컨베이어 벨트 (실제 철학자 초상화/조각상) -->
    <div class="fixed right-8 top-0 h-screen hidden 2xl:flex flex-col items-center overflow-hidden pointer-events-none z-10 py-6 opacity-65 hover:opacity-95 transition duration-500">
        <div class="conveyor-track-down">
            <!-- 세트 1 -->
             <div class="w-72 h-[480px] rounded-3xl overflow-hidden border border-zinc-800 bg-[#141417] shadow-2xl relative">
                <img src="/image/dxeVdJRLiYByqcb0f6G1MPyrt6e2U3e0ug2hx4YjtGm0XKSLGAgcqMr_ZuQ9FcijdRc5HIzmjVDPfchSUuBciEFYVSIciF0g4IoT77-NEnd4gsDQsKkEDjI0qOqVnQXrmy9ctZ02ZQtmeH0f56QYog.webp" alt="Friedrich Nietzsche" class="w-full h-full object-cover filter grayscale contrast-125">
            </div>
            <div class="w-72 h-[480px] rounded-3xl overflow-hidden border border-zinc-800 bg-[#141417] shadow-2xl relative">
                <img src="/image/gskQFog-CJyATIjnf72EnNDKexvf_619rkKuaerwpAHOUfh7ZY_X_ntYunN69SVMz0w43mtWl-YzW4rM77LGjQu-x7ioAbOfcdtHLzIqLhBOqYlDSjtm9NnR0Oj4w10i3y7z3bcyxqT-NwUQIXEhTg.webp" alt="Marcus Aurelius" class="w-full h-full object-cover filter grayscale contrast-125">
            </div>
            <div class="w-72 h-[480px] rounded-3xl overflow-hidden border border-zinc-800 bg-[#141417] shadow-2xl relative">
                <img src="/image/lUImFO4G8gIEgI5fAyBwA7cvErhgJU8mb0-L_QLc2zfhrxraRqhlF093wiJhllRIsoeeKbFATwyQ-U7acXYvFz0fVtg4H9NCGqDglj1WLxJhbpEpNTmNpzeWkL14ogGr912fPqqI30YvIcJB8dV7ug.webp" alt="Socrates" class="w-full h-full object-cover filter grayscale contrast-125">
            </div>
            <div class="w-72 h-[480px] rounded-3xl overflow-hidden border border-zinc-800 bg-[#141417] shadow-2xl relative">
                <img src="/image/OCvYpSic6-yEvpIZb-EerN7IRJ3P4oLvcO-DO79jKSWm7djT3cRKdTHAoapeQeXDkbAXA1a28sQPsEFrdvz_WfdFxm2cC4d3qRWtIIrePUj_1OTL3QQF_XLeaT-YTi3IQ841tf71eGTR1QW9EZa5Dw.webp" alt="Seneca" class="w-full h-full object-cover filter grayscale contrast-125">
            </div>
            <!-- 세트 2 (무한 루프용 복제) -->
             <div class="w-72 h-[480px] rounded-3xl overflow-hidden border border-zinc-800 bg-[#141417] shadow-2xl relative">
                <img src="/image/dxeVdJRLiYByqcb0f6G1MPyrt6e2U3e0ug2hx4YjtGm0XKSLGAgcqMr_ZuQ9FcijdRc5HIzmjVDPfchSUuBciEFYVSIciF0g4IoT77-NEnd4gsDQsKkEDjI0qOqVnQXrmy9ctZ02ZQtmeH0f56QYog.webp" alt="Friedrich Nietzsche" class="w-full h-full object-cover filter grayscale contrast-125">
            </div>
            <div class="w-72 h-[480px] rounded-3xl overflow-hidden border border-zinc-800 bg-[#141417] shadow-2xl relative">
                <img src="/image/gskQFog-CJyATIjnf72EnNDKexvf_619rkKuaerwpAHOUfh7ZY_X_ntYunN69SVMz0w43mtWl-YzW4rM77LGjQu-x7ioAbOfcdtHLzIqLhBOqYlDSjtm9NnR0Oj4w10i3y7z3bcyxqT-NwUQIXEhTg.webp" alt="Marcus Aurelius" class="w-full h-full object-cover filter grayscale contrast-125">
            </div>
            <div class="w-72 h-[480px] rounded-3xl overflow-hidden border border-zinc-800 bg-[#141417] shadow-2xl relative">
                <img src="/image/lUImFO4G8gIEgI5fAyBwA7cvErhgJU8mb0-L_QLc2zfhrxraRqhlF093wiJhllRIsoeeKbFATwyQ-U7acXYvFz0fVtg4H9NCGqDglj1WLxJhbpEpNTmNpzeWkL14ogGr912fPqqI30YvIcJB8dV7ug.webp" alt="Socrates" class="w-full h-full object-cover filter grayscale contrast-125">
            </div>
            <div class="w-72 h-[480px] rounded-3xl overflow-hidden border border-zinc-800 bg-[#141417] shadow-2xl relative">
                <img src="/image/OCvYpSic6-yEvpIZb-EerN7IRJ3P4oLvcO-DO79jKSWm7djT3cRKdTHAoapeQeXDkbAXA1a28sQPsEFrdvz_WfdFxm2cC4d3qRWtIIrePUj_1OTL3QQF_XLeaT-YTi3IQ841tf71eGTR1QW9EZa5Dw.webp" alt="Seneca" class="w-full h-full object-cover filter grayscale contrast-125">
            </div>
        </div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-xl mx-auto bg-[#141417]/90 backdrop-blur-xl border border-zinc-800/80 rounded-3xl p-8 md:p-10 shadow-2xl relative z-20">
        
        <!-- 상단 타이틀 영역 -->
        <header class="text-center mb-8">
            <div class="inline-block mb-3 px-3 py-1 bg-amber-500/10 border border-amber-500/20 rounded-full text-amber-400 text-xs tracking-widest font-light">
                SANCTUARY OF PHILOSOPHY
            </div>
            <h1 class="text-2xl md:text-3xl font-light tracking-wide text-zinc-100 mb-2">사유의 방</h1>
            <p class="text-xs md:text-sm text-zinc-400 font-light">마음속 응어리를 적어내리면, 고대의 현자들이 지혜를 건네어 줍니다.</p>
        </header>

        <!-- STEP 1: 고민 입력 화면 -->
        <div id="input-step" class="space-y-6 fade-in">
            <div class="relative">
                <textarea id="worry-input" rows="5" 
                    class="w-full bg-[#0e0e11] border border-zinc-800 rounded-2xl p-4 text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-amber-500/50 transition resize-none text-sm leading-relaxed shadow-inner"
                    placeholder="예: 다가오는 미래에 대한 막연한 두려움이 있습니다. 내가 올바른 방향으로 가고 있는지 불안합니다..."></textarea>
            </div>
            
            <button onclick="startContemplation()" 
                class="w-full py-4 bg-zinc-100 hover:bg-white text-zinc-950 font-medium rounded-2xl transition duration-300 shadow-lg cursor-pointer text-sm tracking-wider flex items-center justify-center space-x-2">
                <span>사유 시작하기</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>

        <!-- STEP 2: 로딩 화면 -->
        <div id="loading-step" class="hidden flex-col items-center justify-center py-16 space-y-6 fade-in">
            <div class="relative w-12 h-12">
                <div class="absolute inset-0 border-2 border-amber-500/20 rounded-full"></div>
                <div class="absolute inset-0 border-2 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
            <p id="loading-text" class="text-xs text-amber-400/90 font-light tracking-widest animate-pulse">현자가 고통의 의미를 사유하는 중입니다...</p>
        </div>

        <!-- STEP 3: 결과 화면 -->
        <div id="result-step" class="hidden space-y-6 fade-in">
            <div class="bg-[#0e0e11] border border-zinc-800/80 rounded-2xl p-6 md:p-8 space-y-6 relative shadow-inner">
                
                <!-- 사용자가 입력한 고민 표시 박스 -->
                <div class="bg-[#18181c] rounded-xl p-3.5 border border-zinc-800/60">
                    <span class="text-[11px] text-amber-400 font-medium block mb-1">나의 고민</span>
                    <p id="result-user-worry" class="text-xs text-zinc-300 font-light italic leading-relaxed"></p>
                </div>

                <!-- 철학자 태그 -->
                <div class="flex items-center justify-between border-b border-zinc-800/60 pb-3">
                    <span id="philosopher-name" class="text-xs uppercase tracking-widest text-amber-400 font-medium">Friedrich Nietzsche</span>
                    <span class="text-xs text-zinc-500 font-light">현자의 신탁</span>
                </div>

                <!-- 명언 본문 (타이핑 효과 적용) -->
                <blockquote class="space-y-3">
                    <p id="philosopher-quote" class="text-base md:text-lg text-zinc-100 font-light leading-relaxed italic">
                        <!-- 동적 삽입 -->
                    </p>
                </blockquote>

                <!-- 해석 및 위로 -->
                <div class="bg-[#18181c] rounded-xl p-4 border border-zinc-800/50">
                    <p id="philosopher-advice" class="text-xs md:text-sm text-zinc-300 font-light leading-relaxed">
                        <!-- 동적 삽입 -->
                    </p>
                </div>

                <!-- 액션 버튼 그룹 -->
                <div class="flex items-center justify-between pt-2">
                    <button onclick="copyQuote()" class="text-xs text-zinc-400 hover:text-amber-400 transition flex items-center space-x-1.5 cursor-pointer">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span id="copy-text">문장 복사하기</span>
                    </button>
                    <span class="text-[10px] text-zinc-600">Sanctuary of Wisdom</span>
                </div>
            </div>

            <button onclick="resetApp()" 
                class="w-full py-3.5 bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 font-medium rounded-2xl transition duration-200 cursor-pointer text-sm tracking-wider border border-zinc-700/50">
                다른 고민 털어놓기
            </button>
        </div>

    </div>

    <footer class="mt-8 text-center text-xs text-zinc-600 font-light relative z-20">
    </footer>

    <script src="script.js"></script>
</body>
</html>
